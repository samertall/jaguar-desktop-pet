name: Windows build and MSIX validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-validate:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod
      - name: Unit tests and static analysis (Windows)
        working-directory: app
        shell: pwsh
        run: |
          go version
          go vet ./...
          go test -v ./...
      - name: Build and test a non-GUI diagnostics executable
        working-directory: app
        shell: pwsh
        run: |
          go build -trimpath -o JaguarPet-CI.exe .
          & .\JaguarPet-CI.exe --ci-selftest
          if ($LASTEXITCODE -ne 0) { throw "CI runtime self-test failed: $LASTEXITCODE" }
          Remove-Item .\JaguarPet-CI.exe -Force
      - name: Compile Windows GUI executable
        working-directory: app
        shell: pwsh
        run: |
          go build -trimpath -ldflags='-H windowsgui' -o JaguarPet.exe .
          if (!(Test-Path JaguarPet.exe)) { throw 'JaguarPet.exe was not created' }
          Get-Item JaguarPet.exe | Format-Table Name,Length
      - name: Smoke-test Windows overlay, animation timer and window visibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path (Get-Location) 'build\\CI-GUI-RESULT.txt'
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $env:JAGUAR_GUI_SMOKE_REPORT = $report
          $p = Start-Process -FilePath (Resolve-Path .\\app\\JaguarPet.exe) -ArgumentList '--ci-gui-smoke' -PassThru
          try {
            Start-Sleep -Seconds 1
            # Optional debugging screenshot: this is NOT a Store screenshot.
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
                $bitmap.Save((Join-Path (Get-Location) 'build\\CI-DESKTOP-DEBUG.png'), [System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $graphics.Dispose(); $bitmap.Dispose() }
            } catch { Write-Warning "Screen capture unavailable in CI session: $_" }
            $deadline = (Get-Date).AddSeconds(18)
            while (!$p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 300; $p.Refresh() }
            if (!$p.HasExited) { throw 'GUI smoke timed out: window/timer may not have initialized' }
            if ($p.ExitCode -ne 0) { throw "GUI smoke exited with code $($p.ExitCode)" }
            if (!(Test-Path $report)) { throw 'GUI smoke did not produce a report' }
            $text = Get-Content $report -Raw
            Write-Host $text
            if (!$text.Contains('passed=true')) { throw "GUI smoke result not passed: $text" }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Package with official Windows SDK MakeAppx and unpack-test
        shell: pwsh
        run: |
          .\scripts\build-store-package.ps1
      - name: Verify package publisher and executable (offline)
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content .\makeappx-validation-unpacked\AppxManifest.xml -Raw
          $id = $manifest.Package.Identity
          if ($id.Name -cne 'SamerTallauze.JaguarDesktopPet') { throw 'Unexpected Identity Name' }
          if ($id.Publisher -cne 'CN=C83AFC34-5CE3-4E0A-8DCD-9733097BE6AC') { throw 'Unexpected Publisher' }
          if ($id.ProcessorArchitecture -cne 'x64') { throw 'Unexpected Architecture' }
          if (!(Test-Path .\makeappx-validation-unpacked\JaguarPet.exe)) { throw 'EXE not present in unpacked package' }
          Get-FileHash .\build\*_OFFICIAL_MAKEAPPX_UNSIGNED.msix -Algorithm SHA256 | Format-List
          'CI PASS: Windows compilation, unit tests, non-GUI motion/assets, MSIX pack/unpack and manifest checks.' | Set-Content -Path .\build\CI-RESULT.txt
      - name: Upload unsigned MSIX for Partner Center review
        uses: actions/upload-artifact@v4
        with:
          name: jaguar-store-candidate-unsigned-${{ github.run_number }}
          path: |
            build/*_OFFICIAL_MAKEAPPX_UNSIGNED.msix
            build/CI-RESULT.txt
            build/CI-GUI-RESULT.txt
            build/CI-DESKTOP-DEBUG.png
          if-no-files-found: error
          retention-days: 14
